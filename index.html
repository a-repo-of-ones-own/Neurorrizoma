<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Image-Only Rhizome Graph</title>

  <!-- D3.js -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #faf8fc;
    }

    svg {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    svg:active {
      cursor: grabbing;
    }

    #status {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;

      padding: 9px 13px;
      border-radius: 8px;

      color: #514959;
      background: rgba(250, 248, 252, 0.94);
      box-shadow: 0 2px 10px rgba(70, 50, 80, 0.14);

      font-size: 13px;
      pointer-events: none;
    }

    .link {
      fill: none;
      stroke: #9c8ca8;
      stroke-opacity: 0.3;
      stroke-width: 1.5px;
    }

    .node {
      cursor: pointer;
    }

    .node-base {
      fill: #ffffff;
      stroke: #ffffff;
      stroke-width: 4px;
    }

    .thumbnail {
      pointer-events: none;
    }

    .thumbnail-border {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="status">
    Loading images…
  </div>

  <svg
    id="graph"
    aria-label="Interactive image rhizome"
  ></svg>

  <script>
    "use strict";


    /*
    =====================================================
    EDIT THESE VALUES
    =====================================================
    */

    const GITHUB_USER = "a-repo-of-ones-own";
    const GITHUB_REPO = "Neurorrizoma";

    const GITHUB_BRANCH = "main";
    const IMAGE_FOLDER = "images";


    /*
    =====================================================
    IMAGE SIZE SETTINGS
    =====================================================
    */

    // Normal image radius
    const NODE_RADIUS = 34;

    // How large the image becomes when the mouse passes over it
    const HOVER_SCALE = 2.2;

    // Speed of the enlargement animation
    const HOVER_DURATION = 180;


    /*
    =====================================================
    BASIC SETUP
    =====================================================
    */

    const statusBox = document.getElementById("status");

    const svg = d3.select("#graph");

    let width = window.innerWidth;
    let height = window.innerHeight;

    let simulation;

    svg.attr(
      "viewBox",
      [0, 0, width, height]
    );


    /*
    =====================================================
    GRAPH LAYERS
    =====================================================
    */

    const graphLayer = svg
      .append("g");

    const linkLayer = graphLayer
      .append("g");

    const nodeLayer = graphLayer
      .append("g");

    const defs = svg
      .append("defs");


    /*
    =====================================================
    ZOOM AND PAN
    =====================================================
    */

    svg.call(
      d3.zoom()
        .scaleExtent([0.25, 5])
        .on("zoom", event => {
          graphLayer.attr(
            "transform",
            event.transform
          );
        })
    );


    /*
    =====================================================
    LOAD IMAGE FILES FROM GITHUB
    =====================================================
    */

    async function loadImagesFromGitHub() {

      const apiUrl =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(GITHUB_USER)}/` +
        `${encodeURIComponent(GITHUB_REPO)}/` +
        `contents/${encodeURIComponent(IMAGE_FOLDER)}` +
        `?ref=${encodeURIComponent(GITHUB_BRANCH)}`;

      try {

        statusBox.textContent = "Loading images…";

        const response = await fetch(
          apiUrl,
          {
            headers: {
              Accept: "application/vnd.github+json"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            `GitHub returned ${response.status}. ` +
            `Check the username, repository, branch, ` +
            `and images folder name.`
          );
        }

        const files = await response.json();

        if (!Array.isArray(files)) {
          throw new Error(
            "The GitHub images path is not a folder."
          );
        }


        /*
        Keep only image files
        */

        const imageFiles = files
          .filter(file => {

            return (
              file.type === "file" &&
              /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i
                .test(file.name)
            );

          })
          .sort((a, b) => {
            return a.name.localeCompare(b.name);
          });


        if (imageFiles.length === 0) {
          throw new Error(
            `No images were found inside “${IMAGE_FOLDER}”.`
          );
        }


        /*
        Turn the image files into graph nodes
        */

        const nodes = imageFiles.map(
          (file, index) => {

            return {
              id: index,
              name: removeExtension(file.name),
              fileName: file.name,
              imageUrl: file.download_url,
              githubUrl: file.html_url
            };

          }
        );


        /*
        Create connections between images
        */

        const links = createRhizomeLinks(nodes);


        /*
        Draw the graph
        */

        drawGraph(nodes, links);

        statusBox.textContent =
          `${nodes.length} images · ` +
          `hover to enlarge · ` +
          `drag to move`;

      } catch (error) {

        console.error(error);

        statusBox.textContent = error.message;

      }
    }


    /*
    =====================================================
    CREATE RHIZOME-LIKE CONNECTIONS
    =====================================================
    */

    function createRhizomeLinks(nodes) {

      const links = [];

      const usedPairs = new Set();


      function addLink(sourceIndex, targetIndex) {

        if (sourceIndex === targetIndex) {
          return;
        }

        const low = Math.min(
          sourceIndex,
          targetIndex
        );

        const high = Math.max(
          sourceIndex,
          targetIndex
        );

        const key = `${low}-${high}`;

        if (usedPairs.has(key)) {
          return;
        }

        usedPairs.add(key);

        links.push({
          source: nodes[sourceIndex].id,
          target: nodes[targetIndex].id
        });
      }


      nodes.forEach((node, index) => {

        /*
        Connect each image with the next image
        */

        addLink(
          index,
          (index + 1) % nodes.length
        );


        /*
        Connect with the image two positions away
        */

        if (nodes.length > 2) {

          addLink(
            index,
            (index + 2) % nodes.length
          );

        }


        /*
        Add one random connection
        */

        if (nodes.length > 4) {

          const randomIndex =
            Math.floor(
              Math.random() * nodes.length
            );

          addLink(
            index,
            randomIndex
          );

        }
      });


      return links;
    }


    /*
    =====================================================
    DRAW GRAPH
    =====================================================
    */

    function drawGraph(nodes, links) {

      linkLayer
        .selectAll("*")
        .remove();

      nodeLayer
        .selectAll("*")
        .remove();

      defs
        .selectAll("*")
        .remove();


      /*
      Create circular clipping areas
      */

      nodes.forEach(node => {

        defs
          .append("clipPath")
          .attr(
            "id",
            `clip-${node.id}`
          )
          .append("circle")
          .attr(
            "r",
            NODE_RADIUS
          );

      });


      /*
      Create links
      */

      const linkSelection = linkLayer
        .selectAll("path")
        .data(links)
        .join("path")
        .attr(
          "class",
          "link"
        );


      /*
      Create node containers
      */

      const nodeSelection = nodeLayer
        .selectAll("g.node")
        .data(
          nodes,
          node => node.id
        )
        .join("g")
        .attr(
          "class",
          "node"
        )
        .call(
          d3.drag()
            .on(
              "start",
              dragStarted
            )
            .on(
              "drag",
              dragged
            )
            .on(
              "end",
              dragEnded
            )
        );


      /*
      This nested group is enlarged on hover.

      The outer node group continues controlling
      the position of the image.
      */

      const nodeVisual = nodeSelection
        .append("g")
        .attr(
          "class",
          "node-visual"
        )
        .attr(
          "transform",
          "scale(1)"
        );


      /*
      White background
      */

      nodeVisual
        .append("circle")
        .attr(
          "class",
          "node-base"
        )
        .attr(
          "r",
          NODE_RADIUS + 2
        );


      /*
      Thumbnail image
      */

      nodeVisual
        .append("image")
        .attr(
          "class",
          "thumbnail"
        )
        .attr(
          "href",
          node => node.imageUrl
        )
        .attr(
          "x",
          -NODE_RADIUS
        )
        .attr(
          "y",
          -NODE_RADIUS
        )
        .attr(
          "width",
          NODE_RADIUS * 2
        )
        .attr(
          "height",
          NODE_RADIUS * 2
        )
        .attr(
          "preserveAspectRatio",
          "xMidYMid slice"
        )
        .attr(
          "clip-path",
          node => `url(#clip-${node.id})`
        );


      /*
      White border
      */

      nodeVisual
        .append("circle")
        .attr(
          "class",
          "thumbnail-border"
        )
        .attr(
          "r",
          NODE_RADIUS
        );


      /*
      Browser tooltip with image filename
      */

      nodeSelection
        .append("title")
        .text(
          node => node.fileName
        );


      /*
      =====================================================
      ENLARGE IMAGE ON HOVER
      =====================================================
      */

      nodeSelection
        .on(
          "mouseenter",
          function () {

            /*
            Place the selected image above
            the other images
            */

            d3.select(this).raise();


            /*
            Enlarge the visual group
            */

            d3.select(this)
              .select(".node-visual")
              .interrupt()
              .transition()
              .duration(HOVER_DURATION)
              .ease(d3.easeCubicOut)
              .attr(
                "transform",
                `scale(${HOVER_SCALE})`
              );

          }
        )
        .on(
          "mouseleave",
          function () {

            /*
            Return to normal size
            */

            d3.select(this)
              .select(".node-visual")
              .interrupt()
              .transition()
              .duration(HOVER_DURATION)
              .ease(d3.easeCubicOut)
              .attr(
                "transform",
                "scale(1)"
              );

          }
        );


      /*
      Open full-size image when clicked
      */

      nodeSelection.on(
        "click",
        (event, node) => {

          /*
          Do not open the image after dragging it
          */

          if (event.defaultPrevented) {
            return;
          }

          window.open(
            node.imageUrl,
            "_blank",
            "noopener,noreferrer"
          );

        }
      );


      /*
      =====================================================
      FORCE SIMULATION
      =====================================================
      */

      simulation = d3
        .forceSimulation(nodes)

        .force(
          "link",
          d3.forceLink(links)
            .id(
              node => node.id
            )
            .distance(115)
            .strength(0.22)
        )

        .force(
          "charge",
          d3.forceManyBody()
            .strength(-150)
        )

        .force(
          "center",
          d3.forceCenter(
            width / 2,
            height / 2
          )
        )

        .force(
          "x",
          d3.forceX(
            width / 2
          )
          .strength(0.025)
        )

        .force(
          "y",
          d3.forceY(
            height / 2
          )
          .strength(0.025)
        )

        .force(
          "collision",
          d3.forceCollide(
            NODE_RADIUS + 12
          )
        )

        .on(
          "tick",
          ticked
        );


      /*
      Update graph positions
      */

      function ticked() {

        linkSelection.attr(
          "d",
          link => {

            const dx =
              link.target.x -
              link.source.x;

            const dy =
              link.target.y -
              link.source.y;

            const distance = Math.max(
              Math.sqrt(
                dx * dx +
                dy * dy
              ),
              1
            );

            return (
              `M ${link.source.x},${link.source.y}` +
              ` A ${distance},${distance}` +
              ` 0 0,1` +
              ` ${link.target.x},${link.target.y}`
            );

          }
        );


        nodeSelection.attr(
          "transform",
          node => {

            return (
              `translate(` +
              `${node.x}, ` +
              `${node.y}` +
              `)`
            );

          }
        );

      }
    }


    /*
    =====================================================
    DRAG FUNCTIONS
    =====================================================
    */

    function dragStarted(event, node) {

      if (!event.active) {

        simulation
          .alphaTarget(0.3)
          .restart();

      }

      node.fx = node.x;
      node.fy = node.y;
    }


    function dragged(event, node) {

      node.fx = event.x;
      node.fy = event.y;

    }


    function dragEnded(event, node) {

      if (!event.active) {

        simulation
          .alphaTarget(0);

      }

      node.fx = null;
      node.fy = null;

    }


    /*
    =====================================================
    REMOVE FILE EXTENSION
    =====================================================
    */

    function removeExtension(filename) {

      return filename.replace(
        /\.[^/.]+$/,
        ""
      );

    }


    /*
    =====================================================
    WINDOW RESIZING
    =====================================================
    */

    window.addEventListener(
      "resize",
      () => {

        width = window.innerWidth;
        height = window.innerHeight;

        svg.attr(
          "viewBox",
          [0, 0, width, height]
        );

        if (!simulation) {
          return;
        }

        simulation.force(
          "center",
          d3.forceCenter(
            width / 2,
            height / 2
          )
        );

        simulation.force(
          "x",
          d3.forceX(
            width / 2
          )
          .strength(0.025)
        );

        simulation.force(
          "y",
          d3.forceY(
            height / 2
          )
          .strength(0.025)
        );

        simulation
          .alpha(0.4)
          .restart();

      }
    );


    /*
    =====================================================
    INITIALIZE
    =====================================================
    */

    loadImagesFromGitHub();

  </script>

</body>
</html>
